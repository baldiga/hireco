<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 13px system-ui, sans-serif; color: #171717; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #059669; }
    label { display: block; margin-top: 8px; color: #555; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 2px; border: 1px solid #ccc; border-radius: 6px; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #059669; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e5e5e5; color: #171717; }
    button:disabled { opacity: .6; }
    .stats { margin-top: 12px; padding: 10px; background: #f5f5f5; border-radius: 6px; line-height: 1.6; }
    .err { color: #dc2626; margin-top: 8px; }
    .muted { color: #777; }
    .row { display: flex; gap: 8px; } .row button { flex: 1; }
  </style>
</head>
<body>
  <h1>Hireco</h1>
  <div id="setup">
    <label>Server URL <input id="server" placeholder="https://hireco.vercel.app" /></label>
    <label>API key <input id="apiKey" type="password" placeholder="hk_…" /></label>
    <button id="save">Save</button>
  </div>
  <div class="stats" id="stats">Loading…</div>
  <div class="muted" id="progress"></div>
  <div class="err" id="error"></div>
  <div class="row">
    <button id="sync">Sync now</button>
    <button id="pause" class="secondary">Pause enrich</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
