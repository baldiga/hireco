<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Hanken+Grotesk:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="glow"></div>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <span class="word">Hireco</span>
    <span class="badge">Early access</span>
  </header>

  <section id="setup" hidden>
    <h1>Connect your <em>network</em></h1>
    <p class="muted">Paste the API key from your <a id="dash" href="#">Hireco dashboard</a>.</p>
    <input id="apiKey" type="password" placeholder="hk_…" autocomplete="off" />
    <button id="save" class="primary">Connect</button>
  </section>

  <section id="main" hidden>
    <h1 id="hello">Hello</h1>
    <p class="muted" id="email"></p>

    <div class="stats">
      <div><span class="num" id="conns">—</span><span class="lbl">connections</span></div>
      <div><span class="num" id="quota">—</span><span class="lbl">premium prospects left</span></div>
    </div>

    <p class="progress" id="progress"></p>
    <button id="sync" class="primary">Sync now</button>

    <div class="maps" id="maps" hidden>
      <div class="maps-head"><h2>My maps</h2><span class="muted small" id="maps-note">kept 14 days</span></div>
      <ul id="map-list"></ul>
      <button id="maps-more" class="link-btn" hidden></button>
    </div>

    <ol class="steps" id="steps">
      <li id="s1"><span></span>Sync your connections</li>
      <li id="s2"><span></span>Add Hireco to Claude <a id="howto" href="#">how</a></li>
      <li id="s3"><span></span>Ask Claude: <i>“Get started with Hireco”</i></li>
    </ol>

    <button id="guide" class="ghost">Skills &amp; prompts for Claude →</button>
    <p class="foot"><a id="change" href="#">Change key</a></p>
  </section>

  <p class="err" id="error"></p>
  <script src="popup.js" type="module"></script>
</body>
</html>
